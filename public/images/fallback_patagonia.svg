<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142B1F"/>
      <stop offset="60%" stop-color="#1B3D2B"/>
      <stop offset="100%" stop-color="#2C7A9C"/>
    </linearGradient>
    <linearGradient id="mountainBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B778D"/>
      <stop offset="100%" stop-color="#283C48"/>
    </linearGradient>
    <linearGradient id="mountainFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#234232"/>
      <stop offset="100%" stop-color="#0E1C15"/>
    </linearGradient>
    <linearGradient id="lakeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A6F89"/>
      <stop offset="100%" stop-color="#142B1F"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#skyGrad)"/>

  <!-- Distant Andes peaks -->
  <polygon points="120,380 240,160 360,380" fill="url(#mountainBack)" opacity="0.8"/>
  <polygon points="280,380 430,120 580,380" fill="url(#mountainBack)" opacity="0.9"/>
  <polygon points="500,380 640,190 760,380" fill="url(#mountainBack)" opacity="0.75"/>

  <!-- Snow caps -->
  <polygon points="430,120 380,200 420,185 450,210 480,180" fill="#EBF5FB" opacity="0.95"/>
  <polygon points="240,160 200,225 235,215 270,235" fill="#EBF5FB" opacity="0.85"/>
  <polygon points="640,190 600,245 635,235 670,250" fill="#EBF5FB" opacity="0.85"/>

  <!-- Foreground Mountain Ridge -->
  <polygon points="0,460 160,260 380,480" fill="url(#mountainFront)"/>
  <polygon points="260,500 520,290 800,520" fill="url(#mountainFront)"/>

  <!-- Glacial Lake Water -->
  <rect y="440" width="800" height="160" fill="url(#lakeGrad)"/>

  <!-- Golden S-trail reflection line -->
  <path d="M 400 450 Q 430 490 390 520 T 420 570" stroke="#D4A373" stroke-width="3" fill="none" opacity="0.6"/>

  <!-- SURARIO Badge in Center -->
  <rect x="290" y="250" width="220" height="60" rx="12" fill="#0E1C15" fill-opacity="0.85" stroke="#D4A373" stroke-width="1.5"/>
  <text x="400" y="286" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="bold" fill="#FAF8F5" text-anchor="middle" letter-spacing="4">SURARIO</text>
  <text x="400" y="302" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#D4A373" text-anchor="middle" letter-spacing="2">PAISAJE DE LA PATAGONIA</text>
</svg>
